<title>La Ruleta de la Vita 😒</title>
<style>
  :root {
    --mostaza: #eebc3f;
    --mostaza-claro: #f4ca5c;
    --mostaza-oscuro: #d9a428;
    --crema: #fbf3dc;
    --cafe: #3f2a1a;
    --cafe-medio: #6b4226;
    --luiguis: #d94a38;
    --kikes: #2e8f7f;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      repeating-linear-gradient(0deg, rgba(251, 243, 220, 0.06) 0 22px, rgba(63, 42, 26, 0.04) 22px 44px),
      linear-gradient(180deg, var(--mostaza-claro) 0%, var(--mostaza) 45%, var(--mostaza-oscuro) 100%);
    color: var(--cafe);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 56px;
  }

  header { text-align: center; margin-bottom: 4px; }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--cafe-medio);
    font-weight: 700;
    margin: 0 0 10px;
  }

  h1 {
    margin: 0;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: clamp(26px, 6.4vw, 46px);
    line-height: 1.05;
    text-wrap: balance;
    color: var(--cafe);
    text-shadow: 3px 3px 0 rgba(251, 243, 220, 0.85);
  }

  .sub {
    margin: 10px 0 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--cafe-medio);
  }

  .sub .fam-a { color: var(--luiguis); font-weight: 900; }
  .sub .fam-b { color: var(--kikes); font-weight: 900; }

  .stage {
    position: relative;
    width: min(92vw, 520px);
    margin-top: 30px;
    user-select: none;
    -webkit-user-select: none;
  }

  #wheel { display: block; width: 100%; height: auto; }

  .pointer {
    position: absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%) rotate(6deg);
    width: 58px;
    z-index: 6;
    filter: drop-shadow(0 4px 6px rgba(63, 42, 26, 0.45));
    transform-origin: 50% 15%;
  }

  .pointer.wiggle { animation: wiggle 0.12s ease-out; }

  @keyframes wiggle {
    0%   { transform: translateX(-50%) rotate(6deg); }
    40%  { transform: translateX(-50%) rotate(-6deg); }
    100% { transform: translateX(-50%) rotate(6deg); }
  }

  #spin {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 27%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 5px solid var(--crema);
    background: var(--cafe);
    padding: 0;
    overflow: hidden;
    cursor: pointer;
    z-index: 5;
    box-shadow: 0 6px 20px rgba(63, 42, 26, 0.55);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  #spin:hover:not(:disabled) {
    transform: translate(-50%, -50%) scale(1.05);
    box-shadow: 0 8px 26px rgba(63, 42, 26, 0.65);
  }

  #spin:focus-visible { outline: 3px solid var(--cafe); outline-offset: 3px; }
  #spin:disabled { cursor: default; }

  #spin img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 22%;
  }

  #spin.girando img { animation: enojo 0.35s linear infinite; }

  @keyframes enojo {
    0%   { transform: rotate(0deg) scale(1.04); }
    25%  { transform: rotate(-2.5deg) scale(1.05); }
    75%  { transform: rotate(2.5deg) scale(1.05); }
    100% { transform: rotate(0deg) scale(1.04); }
  }

  #spin .lbl {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: rgba(63, 42, 26, 0.88);
    color: var(--crema);
    font-family: inherit;
    font-weight: 900;
    font-size: clamp(11px, 2.2vw, 14px);
    letter-spacing: 0.07em;
    white-space: nowrap;
    padding: 4px 0 6px;
  }

  #status {
    margin-top: 24px;
    min-height: 26px;
    font-size: 16px;
    font-weight: 600;
    font-style: italic;
    color: var(--cafe-medio);
    text-align: center;
  }

  #status .who { font-style: normal; font-weight: 900; text-transform: uppercase; }

  #score {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .chip {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(251, 243, 220, 0.8);
    border: 2px solid var(--cafe);
    font-weight: 700;
  }

  .chip .dot { width: 10px; height: 10px; border-radius: 50%; align-self: center; }

  .chip .strikes { letter-spacing: 3px; font-size: 17px; }
  .chip .strikes .off { opacity: 0.2; filter: grayscale(1); }

  .chip .tag {
    background: var(--cafe);
    color: var(--crema);
    border-radius: 6px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.08em;
    padding: 3px 7px;
    align-self: center;
    text-transform: uppercase;
  }

  .chip.loser {
    background: #fff;
    border-width: 3px;
    transform: rotate(-1.5deg);
  }

  .tools {
    margin-top: 26px;
    width: min(92vw, 520px);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  details {
    background: rgba(251, 243, 220, 0.7);
    border: 2px solid var(--cafe);
    border-radius: 14px;
    padding: 12px 16px;
  }

  summary {
    cursor: pointer;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--cafe-medio);
  }

  summary:focus-visible { outline: 2px solid var(--cafe); outline-offset: 2px; }

  .editor { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

  textarea {
    width: 100%;
    min-height: 74px;
    resize: vertical;
    border-radius: 10px;
    border: 2px solid var(--cafe-medio);
    background: var(--crema);
    color: var(--cafe);
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
  }

  textarea:focus-visible { outline: 2px solid var(--cafe); outline-offset: 1px; }

  .editor .row { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    border: 2px solid var(--cafe);
    background: var(--crema);
    color: var(--cafe);
    font-family: inherit;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 0.04em;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
  }

  .btn:hover { background: #fff; }
  .btn:focus-visible { outline: 2px solid var(--cafe); outline-offset: 2px; }

  .hint { font-size: 13px; color: var(--cafe-medio); margin: 0; }

  /* --- El regaño --- */
  #regano {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 18px;
    background: rgba(43, 26, 12, 0.82);
  }

  #regano[hidden] { display: none; }

  .bubble {
    position: relative;
    max-width: min(92vw, 560px);
    background: var(--crema);
    border: 4px solid var(--cafe);
    border-radius: 20px;
    padding: 18px 26px;
    text-align: center;
    font-weight: 900;
    text-transform: uppercase;
    font-size: clamp(17px, 4.6vw, 27px);
    line-height: 1.25;
    color: var(--cafe);
    animation: pop 0.4s cubic-bezier(0.2, 1.6, 0.4, 1) both;
    animation-delay: 0.35s;
  }

  .bubble::after {
    content: "";
    position: absolute;
    bottom: -17px;
    left: 50%;
    width: 26px;
    height: 26px;
    background: var(--crema);
    border-right: 4px solid var(--cafe);
    border-bottom: 4px solid var(--cafe);
    transform: translateX(-50%) rotate(45deg);
  }

  .tv {
    margin-top: 26px;
    background: #fff;
    border: 10px solid var(--cafe);
    border-radius: 16px;
    transform: rotate(-2.5deg);
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
    animation: sube 0.45s cubic-bezier(0.2, 1.2, 0.4, 1) both;
  }

  .tv img {
    display: block;
    max-height: 44vh;
    max-width: 78vw;
    width: auto;
    height: auto;
  }

  #ok {
    margin-top: 22px;
    border: 3px solid var(--crema);
    background: var(--cafe);
    color: var(--crema);
    font-family: inherit;
    font-weight: 900;
    font-size: clamp(16px, 4vw, 22px);
    letter-spacing: 0.1em;
    padding: 13px 34px;
    border-radius: 999px;
    cursor: pointer;
    animation: pop 0.4s cubic-bezier(0.2, 1.6, 0.4, 1) both;
    animation-delay: 0.55s;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  #ok:hover { transform: scale(1.05); }
  #ok:focus-visible { outline: 3px solid var(--mostaza); outline-offset: 3px; }

  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes sube {
    0% { transform: translateY(70vh) rotate(-2.5deg); }
    100% { transform: translateY(0) rotate(-2.5deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bubble, .tv, #ok { animation: none; }
    .pointer.wiggle, #spin.girando img { animation: none; }
    #spin, #spin:hover:not(:disabled), #ok:hover { transition: none; transform: none; }
    #spin { transform: translate(-50%, -50%); }
  }

  #fx {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }
</style>

<header>
  <p class="eyebrow">Gran sorteo familiar</p>
  <h1>La Ruleta de la Vita 😒</h1>
  <p class="sub"><span class="fam-a">Luiguis</span> contra <span class="fam-b">Kikes</span> · Al tercer chanclazo, ni modo: se la quedan.</p>
</header>

  <button id="ok" type="button">¡SÍ, SEÑORA!</button>

<canvas id="fx"></canvas>

<script>
  const TAU = Math.PI * 2;
  const SIZE = 560;
  const C = SIZE / 2;
  const R = 252;

  const PALETTE = ['#d94a38', '#2e8f7f', '#c98a2c', '#7a5ea8', '#c2527e', '#4a7fb5', '#6d8b3c', '#b5651d'];

  const FRASES = [
    '¡{FAM}! ¡¿Qué es lo que está pasando aquí?!',
    '¡Ganan los {FAM}… pero me lavan los trastes!',
    '¡Aquí mando yo, y dije que ganan los {FAM}!',
    '¡{FAM}! ¡No me hagan ir por la chancla!',
    '¡Se acabó la discusión: ganaron los {FAM}!',
    '¡{FAM}, ni crean que no los estaba viendo!',
    '¡A ver, {FAM}: la chancla los señaló!'
  ];

  const FRASE_FINAL = '¡Se acabó, {FAM}! ¡Ni modo: SE LA QUEDAN!';
  const LIMITE = 3;

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const fx = document.getElementById('fx');
  const fctx = fx.getContext('2d');
  const spinBtn = document.getElementById('spin');
  const spinLbl = spinBtn.querySelector('.lbl');
  const statusEl = document.getElementById('status');
  const scoreEl = document.getElementById('score');
  const pointerEl = document.getElementById('pointer');
  const reganoEl = document.getElementById('regano');
  const bubbleEl = document.getElementById('bubble');
  const okBtn = document.getElementById('ok');

  const dpr = window.devicePixelRatio || 1;
  canvas.width = SIZE * dpr;
  canvas.height = SIZE * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  let names = ['Luiguis', 'Kikes'];
  let segments = [];
  let rot = 0;
  let spinning = false;
  let scores = {};
  let gameOver = false;
  let perdedor = null;
  let actx = null;

  function colorFor(name) {
    return PALETTE[names.indexOf(name) % PALETTE.length];
  }

  function buildSegments() {
    const reps = Math.max(1, Math.ceil(16 / names.length));
    segments = [];
    for (let r = 0; r < reps; r++) for (const n of names) segments.push(n);
  }

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    const seg = TAU / segments.length;

    ctx.save();
    ctx.translate(C, C);
    ctx.rotate(rot);
    segments.forEach((name, i) => {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, i * seg, (i + 1) * seg);
      ctx.closePath();
      ctx.fillStyle = colorFor(name);
      ctx.fill();
      ctx.strokeStyle = 'rgba(63, 42, 26, 0.55)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.rotate(i * seg + seg / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      let fs = Math.min(30, Math.max(13, (TAU * (R - 70) / segments.length) * 0.32));
      ctx.font = '900 ' + fs + 'px system-ui, sans-serif';
      while (ctx.measureText(name.toUpperCase()).width > R - 105 && fs > 11) {
        fs -= 1;
        ctx.font = '900 ' + fs + 'px system-ui, sans-serif';
      }
      ctx.fillStyle = 'rgba(63, 42, 26, 0.85)';
      ctx.fillText(name.toUpperCase(), R - 22, 2);
      ctx.fillStyle = '#fbf3dc';
      ctx.fillText(name.toUpperCase(), R - 24, 0);
      ctx.restore();
    });
    ctx.restore();

    ctx.save();
    ctx.translate(C, C);
    ctx.beginPath();
    ctx.arc(0, 0, R + 8, 0, TAU);
    ctx.strokeStyle = '#6b4226';
    ctx.lineWidth = 10;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, R + 14, 0, TAU);
    ctx.strokeStyle = 'rgba(63, 42, 26, 0.3)';
    ctx.lineWidth = 3;
    ctx.stroke();

    const lights = 24;
    for (let i = 0; i < lights; i++) {
      const a = (i / lights) * TAU;
      const on = spinning ? (i + Math.floor(performance.now() / 90)) % 2 === 0 : i % 2 === 0;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * (R + 8), Math.sin(a) * (R + 8), 4.5, 0, TAU);
      ctx.fillStyle = on ? '#fbf3dc' : 'rgba(43, 26, 12, 0.55)';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(0, 0, 84, 0, TAU);
    ctx.fillStyle = 'rgba(251, 243, 220, 0.9)';
    ctx.fill();
    ctx.restore();
  }

  function winnerIndex() {
    const seg = TAU / segments.length;
    const a = (((-Math.PI / 2 - rot) % TAU) + TAU) % TAU;
    return Math.floor(a / seg);
  }

  // --- Sonido ---
  function ensureAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }

  function tick(progreso) {
    if (!actx) return;
    const t = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'square';
    o.frequency.value = 950 - 480 * (progreso || 0);
    g.gain.setValueAtTime(0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0005, t + 0.05);
    o.connect(g).connect(actx.destination);
    o.start(t);
    o.stop(t + 0.06);
  }

  function fanfare() {
    if (!actx) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const t = actx.currentTime + i * 0.12;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(g).connect(actx.destination);
      o.start(t);
      o.stop(t + 0.32);
    });
  }

  function trombon() {
    if (!actx) return;
    [233.08, 220, 207.65, 196].forEach((f, i) => {
      const t = actx.currentTime + i * 0.38;
      const dur = i === 3 ? 1.1 : 0.34;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, t);
      if (i === 3) o.frequency.setValueAtTime(f * 0.985, t + 0.55);
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.1, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(actx.destination);
      o.start(t);
      o.stop(t + dur + 0.05);
    });
  }

  // --- Giro ---
  function resetGame() {
    scores = {};
    gameOver = false;
    perdedor = null;
    spinLbl.textContent = 'GIRAR';
    renderScore();
  }

  function spin() {
    if (spinning) return;
    if (gameOver) resetGame();
    ensureAudio();
    spinning = true;
    spinBtn.disabled = true;
    spinBtn.classList.add('girando');
    spinLbl.textContent = '...';
    statusEl.textContent = 'La señora está decidiendo… no la interrumpan.';

    const duration = 9000 + Math.random() * 2500;
    const turns = 10 + Math.random() * 5;
    const from = rot;
    const to = rot + turns * TAU + Math.random() * TAU;
    const t0 = performance.now();
    let lastIdx = winnerIndex();
    let drama = 0;

    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      const ease = 1 - Math.pow(1 - t, 6);
      rot = from + (to - from) * ease;
      draw();

      if (t > 0.9 && drama < 2) {
        drama = 2;
        statusEl.textContent = '¡No respiren, ya casi cae!';
      } else if (t > 0.72 && drama < 1) {
        drama = 1;
        statusEl.textContent = 'Ya mero… ya mero…';
      }

      const idx = winnerIndex();
      if (idx !== lastIdx) {
        lastIdx = idx;
        tick(t);
        pointerEl.classList.remove('wiggle');
        void pointerEl.getBoundingClientRect();
        pointerEl.classList.add('wiggle');
      }

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        finish();
      }
    }
    requestAnimationFrame(frame);
  }

  function finish() {
    spinning = false;
    spinBtn.disabled = false;
    spinBtn.classList.remove('girando');
    const name = segments[winnerIndex()];
    scores[name] = (scores[name] || 0) + 1;
    const col = colorFor(name);
    const famHtml = '<span style="color:' + col + '">' + escapeHtml(name.toUpperCase()) + '</span>';

    if (scores[name] >= LIMITE) {
      gameOver = true;
      perdedor = name;
      spinLbl.textContent = 'OTRA VEZ';
      bubbleEl.innerHTML = escapeHtml(FRASE_FINAL).replace('{FAM}', famHtml);
      okBtn.textContent = 'NI MODO…';
      statusEl.innerHTML = 'Los <span class="who" style="color:' + col + '">' + escapeHtml(name) + '</span> se la quedan. Ni modo.';
      trombon();
    } else {
      spinLbl.textContent = 'GIRAR';
      const frase = FRASES[Math.floor(Math.random() * FRASES.length)];
      bubbleEl.innerHTML = escapeHtml(frase).replace('{FAM}', famHtml);
      okBtn.textContent = '¡SÍ, SEÑORA!';
      statusEl.innerHTML = 'Regaño ' + scores[name] + ' de ' + LIMITE + ' para los <span class="who" style="color:' + col + '">' + escapeHtml(name) + '</span>.';
      fanfare();
    }

    renderScore();
    confetti(col);
    draw();

    reganoEl.hidden = false;
    okBtn.focus();
  }

  function cerrarRegano() {
    reganoEl.hidden = true;
    spinBtn.focus();
  }

  okBtn.addEventListener('click', cerrarRegano);
  reganoEl.addEventListener('click', (e) => { if (e.target === reganoEl) cerrarRegano(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !reganoEl.hidden) cerrarRegano();
  });

  // --- Marcador ---
  function renderScore() {
    scoreEl.innerHTML = names.map(n => {
      const hits = scores[n] || 0;
      let slots = '';
      for (let i = 0; i < LIMITE; i++) {
        slots += '<span class="' + (i < hits ? 'on' : 'off') + '">🩴</span>';
      }
      const esPerdedor = gameOver && n === perdedor;
      return '<span class="chip' + (esPerdedor ? ' loser' : '') + '">' +
        '<span class="dot" style="background:' + colorFor(n) + '"></span>' +
        escapeHtml(n) + ' <span class="strikes">' + slots + '</span>' +
        (esPerdedor ? '<span class="tag">se la quedan</span>' : '') +
        '</span>';
    }).join('');
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // --- Confeti ---
  let parts = [];
  let fxRunning = false;

  function confetti(mainColor) {
    fx.width = innerWidth * dpr;
    fx.height = innerHeight * dpr;
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = [mainColor, '#fbf3dc', '#eebc3f', mainColor];
    for (let i = 0; i < 160; i++) {
      parts.push({
        x: Math.random() * innerWidth,
        y: -20 - Math.random() * innerHeight * 0.4,
        vx: (Math.random() - 0.5) * 2.4,
        vy: 2 + Math.random() * 3.5,
        s: 5 + Math.random() * 7,
        c: cols[i % cols.length],
        a: Math.random() * TAU,
        va: (Math.random() - 0.5) * 0.25
      });
    }
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxFrame); }
  }

  function fxFrame() {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.025;
      p.a += p.va;
      fctx.save();
      fctx.translate(p.x, p.y);
      fctx.rotate(p.a);
      fctx.fillStyle = p.c;
      fctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      fctx.restore();
    });
    parts = parts.filter(p => p.y < innerHeight + 30);
    if (parts.length) {
      requestAnimationFrame(fxFrame);
    } else {
      fxRunning = false;
      fctx.clearRect(0, 0, innerWidth, innerHeight);
    }
  }

  // --- Editor ---
  document.getElementById('apply').addEventListener('click', () => {
    const list = document.getElementById('names').value
      .split('\n').map(s => s.trim()).filter(Boolean);
    if (list.length < 2) return;
    names = list;
    buildSegments();
    resetGame();
    draw();
  });

  document.getElementById('reset').addEventListener('click', resetGame);

  spinBtn.addEventListener('click', spin);

  setInterval(() => { if (spinning) draw(); }, 90);

  buildSegments();
  renderScore();
  draw();
</script>
